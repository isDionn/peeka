[package]
name = "notch-core"
description = "Notch domain model, ports and fake adapters (no Windows, no Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# All three already in Cargo.lock (Tauri's own): link checks, the HTTP adapter's key and request parsing.
url = "2.5.8"
getrandom = "0.3.4"
httparse = "1.10.1"
# Plugin API (Wave 3), both in Cargo.lock already: the token digest and the token / image encoding.
sha2 = "0.10.9"
base64 = "0.22.1"
# Wave 4, in Cargo.lock already (Tauri's own): the password class patterns.
regex = "1.13.1"
