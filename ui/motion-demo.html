<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peeka hareket demosu</title>
<style>
  :root { --strip:#0A0A0B; --kart:#121214; --kart2:#161618; --e2:#2C2C2E; --l1:#F5F5F7; --l2:rgba(235,235,245,.74); --ease:cubic-bezier(.23,1,.32,1); }
  * { box-sizing:border-box; margin:0; padding:0 }
  html, body { height:100%; overflow:hidden; background:radial-gradient(90% 120% at 20% 100%, #1d2a44, transparent 60%), radial-gradient(70% 100% at 90% 90%, #3a2340, transparent 60%), #08080a; color:var(--l1); font:500 13px/18px system-ui, "Segoe UI", sans-serif }
  /* şerit: 30 px */
  #strip { position:absolute; inset:0 0 auto 0; height:30px; background:var(--strip); z-index:10; display:flex; align-items:center; padding:0 8px; gap:4px }
  #tabs { position:relative; display:flex; gap:2px; height:24px }
  #tabs button { position:relative; z-index:1; background:none; border:0; color:var(--l2); padding:0 10px; font:inherit; height:24px; cursor:pointer }
  #tabs button.on { color:var(--l1) }
  #pill { background:var(--e2) }
  #mid { position:absolute; left:50%; top:0; height:30px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:0 14px; white-space:nowrap }
  [data-paylas="kapak"] { display:inline-block; vertical-align:middle; width:18px; height:18px; border-radius:5px; background:linear-gradient(135deg,#ff7a70,#7a5cff); flex:none; transform-origin:0 0 }
  [data-paylas="ad"] { display:inline-block; transform-origin:0 0; white-space:nowrap }
  /* ada: sabit boyutlu host (pencere) içinde clip-path ile büyür */
  #host { position:absolute; top:30px; left:50%; margin-left:-280px; z-index:5 }
  #body { background:linear-gradient(180deg, var(--strip) 0, var(--kart) 40px, var(--kart2) 100%); }
  .row { position:absolute; top:0; left:0; right:0; height:34px; display:flex; align-items:center; justify-content:center; gap:10px; padding-bottom:6px }
  .prog { width:120px; height:3px; border-radius:2px; background:rgba(255,255,255,.16); overflow:hidden } .prog b { display:block; height:100%; width:36%; background:var(--l1) }
  #cardc { position:absolute; left:0; right:0; top:44px; bottom:0; padding:14px 16px; display:grid; grid-template-columns:120px 1fr; gap:16px; opacity:0 }
  #big { width:120px; height:120px; border-radius:18px; background:linear-gradient(135deg,#ff7a70,#7a5cff) }
  #cardTitle { font:600 20px/25px system-ui; letter-spacing:-.45px }
  #controls { position:fixed; bottom:12px; left:12px; z-index:20; display:flex; gap:8px }
  #controls button { background:#2c2c2e; color:#f5f5f7; border:0; border-radius:999px; padding:6px 14px; font:inherit; cursor:pointer }
  #hit { position:fixed; bottom:12px; right:12px; z-index:20; font:11px/14px ui-monospace, Consolas, monospace; color:#9a9aa0 }
</style>
</head>
<body>
<div id="strip">
  <div id="tabs"><div id="pill"></div><button class="on" data-i="0">Chrome</button><button data-i="1">VS Code</button><button data-i="2">Dosyalar</button></div>
  <div id="mid"><span id="slotStrip"><span data-paylas="kapak"></span></span><span id="titleStrip"><span data-paylas="ad">Gece Yarısı</span></span></div>
</div>

<div id="host" class="nm-host">
  <div class="nm-layers" id="layers"></div>
  <div id="body">
    <div class="row"><span id="rowText">Çalıyor</span><div class="prog"><b></b></div></div>
    <div id="cardc"><div id="slotCard"></div><div><div id="titleCard"></div><div style="color:var(--l2);margin-top:6px">Müzik Örnek · 3:42</div></div></div>
  </div>
</div>

<div id="controls"><button data-s="rest">Dinlenme</button><button data-s="protrusion">Çıkıntı</button><button data-s="card">Kart</button></div>
<div id="hit"></div>

<script type="module">
import { createShape, mountShoulders, createFlight, createPill, hoverIntent, hoverLift, press } from "/src/motion/index.ts";

const $ = (id) => document.getElementById(id);
const host = $("host"), body = $("body"), card = $("cardc"), hit = $("hit");
const sh = mountShoulders($("layers"));
sh.setAmbient("#7a5cff");
const shape = createShape(host, body, {
  maxW: 560, maxH: 240, restW: 200,
  layers: [sh.layer, (s) => { card.style.opacity = String(Math.min(1, Math.max(0, (s.h - 70) / 90))); }],
  onRect: (r) => { hit.textContent = `hit ${r.x},${r.y} ${r.w}×${r.h}`; window.__lastRect = r; },
});
const flight = createFlight();
let at = "rest";

const cover = document.querySelector('[data-paylas="kapak"]'), title = document.querySelector('[data-paylas="ad"]');
function place(card_) {
  cover.style.cssText = ""; title.style.cssText = "";
  (card_ ? $("slotCard") : $("slotStrip")).append(cover);
  (card_ ? $("titleCard") : $("titleStrip")).append(title);
  cover.style.width = card_ ? "120px" : "18px"; cover.style.height = card_ ? "120px" : "18px"; cover.style.borderRadius = card_ ? "18px" : "5px";
  title.style.font = card_ ? "600 20px/25px system-ui" : "";
}
function go(state) {
  if (state === at) return;
  const toCard = state === "card";
  flight.capture();
  place(toCard);
  flight.play();
  at = state;
  if (state === "rest") shape.to(200, 0);
  else if (state === "protrusion") shape.to(300, 44);
  else shape.to(560, 240);
}
document.querySelectorAll("#controls button").forEach((b) => { b.onclick = () => go(b.dataset.s); press(b); });
window.demo = { go, shape, flight };

// akan vurgu
const pill = createPill($("tabs"), $("pill"));
const tabs = [...document.querySelectorAll("#tabs button")];
pill.to(tabs[0], { instant: true });
tabs.forEach((t) => { t.onclick = () => { tabs.forEach((x) => x.classList.toggle("on", x === t)); pill.to(t, { streak: true }); }; press(t); });

// üstüne gelme: 120 ms niyet, 200 ms kapanma; 14 px göz atma
const mid = $("mid");
hoverIntent(mid, { keep: [host], canOpen: () => at === "rest", onOpen: () => shape.to(240, 14), onClose: () => at === "rest" && shape.to(200, 0) });
hoverLift(mid);

// tam bir tur: dinlenme → çıkıntı → kart → geri
window.runCycle = async () => {
  const w = (ms) => new Promise((r) => setTimeout(r, ms));
  go("protrusion"); await w(700);
  go("card"); await w(1000);
  go("protrusion"); await w(700);
  go("rest"); await w(600);
};
if (location.search.includes("auto")) window.runCycle();
</script>
</body>
</html>
